; Development PHP settings - show errors in browser
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Keep logging to container stderr as well
log_errors = On
error_log = /proc/self/fd/2

; Optional: longer execution for debugging heavy requests (adjust as needed)
max_execution_time = 120
memory_limit = 512M

; Opcache dev-friendly settings
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0


server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # Route all requests to Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /dgastro24 {
        try_files $uri $uri/ /dgastro24/index.php?$query_string;
    }

    location /api.d-gastro24.de {
        alias /var/www/html/api.d-gastro24.de/public;
        try_files $uri $uri/ @api_laravel;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    location @api_laravel {
        rewrite /api.d-gastro24.de/(.*)$ /api.d-gastro24.de/index.php?$1 last;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
